<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keranjang Belanja - TokoKita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-shop"></i> TokoKita</a>
            <div class="collapse navbar-collapse justify-content-end d-flex">
                <a href="cart.html" class="btn btn-outline-light position-relative">
                    <i class="bi bi-cart3"></i> Keranjang
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger cart-badge">0</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- KONTEN KERANJANG -->
    <div class="container" style="margin-top: 100px; min-height: 70vh;">
        <h2 class="mb-4 fw-bold">Keranjang Belanja</h2>
        <div class="row">
            <div class="col-lg-8 mb-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body" id="cart-items-container">
                        <!-- List item dari JS -->
                    </div>
                </div>
            </div>
            
            <!-- RINGKASAN BELANJA -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h4 class="card-title mb-4 fw-bold">Ringkasan Belanja</h4>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Total Harga</span>
                            <span id="summary-subtotal" class="fw-bold">Rp 0</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Total Diskon</span>
                            <span id="summary-discount" class="text-danger fw-bold">-Rp 0</span>
                        </div>
                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-muted">Ongkos Kirim</span>
                            <span class="fw-bold">Rp 20.000</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between mb-4 fw-bold fs-5">
                            <span>Total Bayar</span>
                            <span id="summary-total" class="text-primary">Rp 0</span>
                        </div>
                        <a href="checkout.html" class="btn btn-primary w-100 py-2 fw-bold" id="checkout-btn">Lanjut ke Checkout</a>
                        <a href="index.html" class="btn btn-outline-secondary w-100 mt-2">Lanjut Belanja</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-black text-white text-center py-4 mt-5">
        <p class="mb-0">&copy; 2023 TokoKita.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="app.js"></script>
</body>
</html>
