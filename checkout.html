<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - TokoKita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-shop"></i> TokoKita</a>
        </div>
    </nav>

    <div class="container" style="margin-top: 100px; min-height: 70vh;">
        <h2 class="mb-4 fw-bold">Checkout</h2>
        <form id="checkout-form">
            <div class="row">
                <!-- FORM PENGIRIMAN & PEMBAYARAN -->
                <div class="col-lg-7 mb-4">
                    <div class="card shadow-sm border-0 mb-4">
                        <div class="card-body">
                            <h5 class="mb-3 fw-bold">Data Pengiriman</h5>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Nama Lengkap</label>
                                    <input type="text" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Alamat Lengkap</label>
                                    <textarea class="form-control" rows="3" required></textarea>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Kota</label>
                                    <input type="text" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Kode Pos</label>
                                    <input type="text" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">No. HP</label>
                                    <input type="tel" class="form-control" required>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card shadow-sm border-0 mb-4">
                        <div class="card-body">
                            <h5 class="mb-3 fw-bold">Metode Pengiriman</h5>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" name="shipping" id="reguler" checked>
                                <label class="form-check-label" for="reguler">Reguler (Rp 20.000)</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="shipping" id="express">
                                <label class="form-check-label" for="express">Express (Rp 50.000)</label>
                            </div>
                        </div>
                    </div>

                    <div class="card shadow-sm border-0 mb-4">
                        <div class="card-body">
                            <h5 class="mb-3 fw-bold">Metode Pembayaran</h5>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" name="payment" id="transfer" checked>
                                <label class="form-check-label" for="transfer">Transfer Bank</label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" name="payment" id="ewallet">
                                <label class="form-check-label" for="ewallet">E-Wallet (OVO/Gopay)</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="payment" id="cod">
                                <label class="form-check-label" for="cod">COD (Bayar di Tempat)</label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- RINGKASAN PESANAN -->
                <div class="col-lg-5">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h4 class="card-title mb-4 fw-bold">Ringkasan Pesanan</h4>
                            <div id="checkout-items"></div>
                            <hr>
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">Subtotal</span>
                                <span id="checkout-subtotal" class="fw-bold">Rp 0</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">Ongkos Kirim</span>
                                <span id="checkout-shipping" class="fw-bold">Rp 20.000</span>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between mb-4 fw-bold fs-5">
                                <span>Total Bayar</span>
                                <span id="checkout-total" class="text-primary">Rp 0</span>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold">Buat Pesanan</button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
